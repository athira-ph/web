<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f6f2">
  <title>Wanderlight — Image Gallery</title>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <a class="wordmark" href="#" aria-label="Wanderlight home">wanderlight<span>.</span></a>
      <p class="eyebrow">A collection of places</p>
      <h1>Somewhere <em>beautiful.</em></h1>
      <p class="intro">A little inspiration for your next escape. Pick a photograph to take a closer look.</p>
    </header>

    <section class="gallery" aria-label="Travel photography gallery">
      <button class="gallery-item item-tall" type="button" data-index="0" aria-label="View photo: Mountain lake at sunrise">
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1000&q=85" alt="A mountain lake reflecting the sunrise" fetchpriority="high">
        <span class="photo-caption"><span>01 / ALPINE QUIET</span><span>Dolomites, Italy</span></span>
      </button>
      <button class="gallery-item item-wide" type="button" data-index="1" aria-label="View photo: Coastal cliffs above the sea">
        <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1200&q=85" alt="Ocean waves rolling against a rugged coast" loading="lazy">
        <span class="photo-caption"><span>02 / SALT &amp; SKY</span><span>Amalfi Coast, Italy</span></span>
      </button>
      <button class="gallery-item" type="button" data-index="2" aria-label="View photo: Forest path in autumn">
        <img src="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1000&q=85" alt="Sunlight filtering through a quiet green forest" loading="lazy">
        <span class="photo-caption"><span>03 / INTO THE GREEN</span><span>Olympic National Park, USA</span></span>
      </button>
      <button class="gallery-item item-tall" type="button" data-index="3" aria-label="View photo: Desert dunes at golden hour">
        <img src="https://images.unsplash.com/photo-1509316785289-025f5b846b35?auto=format&fit=crop&w=1000&q=85" alt="Soft golden light falling over desert sand dunes" loading="lazy">
        <span class="photo-caption"><span>04 / SLOW DESERT</span><span>Merzouga, Morocco</span></span>
      </button>
      <button class="gallery-item item-wide" type="button" data-index="4" aria-label="View photo: Mountain peaks above the clouds">
        <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=85" alt="Snow-dusted mountain peaks beneath a clear sky" loading="lazy">
        <span class="photo-caption"><span>05 / ABOVE IT ALL</span><span>Swiss Alps, Switzerland</span></span>
      </button>
      <button class="gallery-item" type="button" data-index="5" aria-label="View photo: Tropical island and turquoise water">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1000&q=85" alt="Turquoise tropical water meeting a sandy beach" loading="lazy">
        <span class="photo-caption"><span>06 / BLUE HOURS</span><span>Maldives</span></span>
      </button>
    </section>

    <footer class="page-footer">
      <span>WANDER OFTEN. WONDER ALWAYS.</span>
      <span>06 MOMENTS, ONE LITTLE GALLERY</span>
    </footer>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image slideshow" aria-hidden="true">
    <button class="lightbox-close icon-button" id="close-button" type="button" aria-label="Close slideshow">×</button>
    <button class="lightbox-arrow previous icon-button" id="previous-button" type="button" aria-label="Previous image">‹</button>
    <figure class="lightbox-figure">
      <img class="lightbox-image" id="lightbox-image" src="" alt="">
      <figcaption class="lightbox-caption" id="lightbox-caption"></figcaption>
    </figure>
    <button class="lightbox-arrow next icon-button" id="next-button" type="button" aria-label="Next image">›</button>
    <div class="lightbox-toolbar">
      <span class="slide-count" id="slide-count" aria-live="polite"></span>
      <button class="autoplay-button" id="autoplay-button" type="button" aria-pressed="false">Start slideshow <span aria-hidden="true">↗</span></button>
    </div>
  </div>
</body>
</html>
